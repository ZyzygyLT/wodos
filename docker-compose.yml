version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: ironhold-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: ironhold
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ironhold-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
